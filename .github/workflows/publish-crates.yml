name: Publish to crates.io

# A dist custom publish job (see dist-workspace.toml's `publish-jobs`) — dist
# has no builtin crates.io publisher, only Homebrew/npm.
on:
  workflow_call:
    inputs:
      # Unused here, but dist's custom-publish-job contract always passes it.
      # Removing it breaks the generated caller in release.yml.
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-crates:
    runs-on: ubuntu-latest
    steps:
      # v6 to match the checkout the generated release.yml uses.
      - uses: actions/checkout@v6
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
